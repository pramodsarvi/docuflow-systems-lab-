apiVersion: apps/v1
kind: Deployment
metadata: {name: worker-io, namespace: docuflow, labels: {app: worker-io}}
spec:
  replicas: 1      # KEDA owns the replica count
  selector: {matchLabels: {app: worker-io}}
  template:
    metadata: {labels: {app: worker-io, docuflow-lane: io}}
    spec:
      priorityClassName: tenant-batch         # ingest yields to interactive tenants when GPUs run out
      terminationGracePeriodSeconds: 180      # let the running job finish on scale-down
      containers:
        - name: worker
          image: docuflow:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "docuflow", "worker", "io"]
          envFrom: [{configMapRef: {name: docuflow-config}}]
          resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {memory: 3Gi}}   # XFUND pages are ~2480px scans
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker-vlm, namespace: docuflow, labels: {app: worker-vlm}}
spec:
  replicas: 0      # KEDA owns the replica count
  selector: {matchLabels: {app: worker-vlm}}
  template:
    metadata: {labels: {app: worker-vlm, docuflow-lane: vlm}}
    spec:
      priorityClassName: tenant-batch         # ingest yields to interactive tenants when GPUs run out
      terminationGracePeriodSeconds: 180      # let the running job finish on scale-down
      containers:
        - name: worker
          image: docuflow:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "docuflow", "worker", "vlm"]
          envFrom: [{configMapRef: {name: docuflow-config}}]
          resources: {requests: {cpu: 100m, memory: 192Mi, nvidia.com/gpu: 1}, limits: {memory: 512Mi, nvidia.com/gpu: 1}}
---
