# One Deployment per lane. Replicas are owned by KEDA (keda.yaml); every lane scales to zero when its queue is empty.
# Scale-down sends SIGTERM: the worker finishes its current job (up to the grace period) and exits; anything cut off
# is requeued by lease expiry.
---
# io: fetch slices from the dataset source, store page images
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker-io, labels: {app: worker-io}}
spec:
  # no `replicas`: KEDA owns it, and a value here would reset the live count on every `kubectl apply`
  revisionHistoryLimit: 5
  selector: {matchLabels: {app: worker-io}}
  template:
    metadata:
      labels: {app: worker-io, app.kubernetes.io/component: worker, docuflow-lane: io}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9100", prometheus.io/path: /metrics}
    spec:
      serviceAccountName: docuflow
      priorityClassName: docuflow-batch
      terminationGracePeriodSeconds: 180
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: docuflow
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "docuflow", "worker", "io"]
          envFrom:
            - configMapRef: {name: docuflow-config}
            - secretRef: {name: docuflow-secrets}
          ports: [{name: metrics, containerPort: 9100}]
          livenessProbe: {httpGet: {path: /health, port: metrics}, initialDelaySeconds: 20, periodSeconds: 15, failureThreshold: 4}
          resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {memory: 3Gi}}   # XFUND pages are ~2480px scans
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 2Gi}}]
---
