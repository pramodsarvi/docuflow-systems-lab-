apiVersion: v1
kind: Service
metadata: {name: api, labels: {app: api}}
spec:
  selector: {app: api}
  ports: [{name: http, port: 8791, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, labels: {app: api}}
spec:
  replicas: 1            # KEDA owns the replica count (keda.yaml)
  revisionHistoryLimit: 5
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: api}}
  template:
    metadata:
      labels: {app: api, app.kubernetes.io/component: api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8791", prometheus.io/path: /metrics}
    spec:
      serviceAccountName: docuflow
      priorityClassName: docuflow-interactive        # queries outrank ingest
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: api}}}
      containers:
        - name: api
          image: docuflow
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "docuflow.api:app", "--host", "0.0.0.0", "--port", "8791", "--log-level", "warning",
                    "--timeout-graceful-shutdown", "50"]
          envFrom:
            - configMapRef: {name: docuflow-config}
            - secretRef: {name: docuflow-secrets}
          ports: [{name: http, containerPort: 8791}]
          startupProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 3, failureThreshold: 40}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 6}
          lifecycle: {preStop: {exec: {command: ["sleep", "5"]}}}   # let endpoints drop the pod before it stops accepting
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {memory: 1Gi}}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 1Gi}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api}
spec: {maxUnavailable: 1, selector: {matchLabels: {app: api}}}   # with KEDA min 2 (prod) one pod always serves
