# Shared settings for every docuflow pod. Switch OLLAMA_URL to use real models (see `make k8s-real`).
apiVersion: v1
kind: ConfigMap
metadata: {name: docuflow-config, namespace: docuflow}
data:
  DOCUFLOW_DSN: postgresql://docuflow:docuflow@db.docuflow.svc.cluster.local:5432/docuflow?sslmode=disable
  OLLAMA_URL: http://sim-model:11434           # real: http://host.docker.internal:11434
  VLM_MODEL: gemma4:e2b-mlx
  LLM_MODEL: qwen3:4b-instruct
  EMBED_MODEL: qwen3-embedding:0.6b
  # Pod count is the concurrency limit on Kubernetes; the in-app limits only need to sit above the max replicas.
  LIMIT_IO: "4"
  LIMIT_VLM: "12"
  LIMIT_EMBED: "6"
  PROCS_IO: "4"
  PROCS_VLM: "12"
  PROCS_EMBED: "6"
  PER_DATASET_CAP: "6"
  LEASE_SECONDS: "300"
  HF_HOME: /tmp/hf
