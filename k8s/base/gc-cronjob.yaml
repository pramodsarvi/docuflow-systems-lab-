# Retention: delete finished jobs and old query traces (GC_DONE_JOBS_DAYS / GC_QUERIES_DAYS in the ConfigMap).
apiVersion: batch/v1
kind: CronJob
metadata: {name: docuflow-gc}
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata: {labels: {app: docuflow-gc}}
        spec:
          serviceAccountName: docuflow
          priorityClassName: docuflow-batch
          restartPolicy: OnFailure
          securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: gc
              image: docuflow
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "docuflow", "gc"]
              envFrom:
                - configMapRef: {name: docuflow-config}
                - secretRef: {name: docuflow-secrets}
              resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
              securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
