# Intelligent LLM Gateway with llm-d / Gateway API
# Routes requests based on vLLM queue depth and KV-cache utilization
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
data:
  config.yaml: |
    # Gateway configuration for intelligent request routing

    models:
      extract:
        base_url: "http://model-vlm"
        port: 8000
        replicas: 2  # Dynamic range 1-8 from KEDA
        route_algorithm: "least_pending_requests"  # ← Intelligent
        batch_size: 16
        kv_cache_budget_mb: 40000

      embed:
        base_url: "http://model-embed"
        port: 8001
        replicas: 1  # Dynamic range 1-4 from KEDA
        route_algorithm: "least_pending_requests"
        batch_size: 128
        kv_cache_budget_mb: 8000

    routing:
      # Route to replica with least queue depth
      strategy: "least_pending_requests"

      # Fall back to round-robin if metrics unavailable
      fallback: "round_robin"

      # Health check before routing
      health_check_interval_ms: 5000

      # Load shedding: reject if all replicas > threshold
      queue_threshold_per_replica: 32

    metrics:
      # Export metrics for Prometheus
      port: 9090
      path: "/metrics"

    tracing:
      # Optional: OpenTelemetry integration
      enabled: false
      # endpoint: "http://jaeger:4317"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels:
    app: llm-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 2  # HA: two gateway instances
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: docuflow
      containers:
      - name: gateway
        # Use llm-d, Envoy, or LiteLLM
        # Option 1: llm-d (recommended for vLLM-aware routing)
        image: ghcr.io/ray-project/llm-d:latest
        # Option 2: LiteLLM (more features, slower)
        # image: ghcr.io/berriai/litellm:main

        ports:
        - name: http
          containerPort: 8000
        - name: metrics
          containerPort: 9090

        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: METRICS_PORT
          value: "9090"

        volumeMounts:
        - name: config
          mountPath: /etc/llm-gateway
          readOnly: true

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            memory: 1Gi

      volumes:
      - name: config
        configMap:
          name: llm-gateway-config

---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  labels:
    app: llm-gateway
spec:
  type: ClusterIP
  selector:
    app: llm-gateway
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  - name: metrics
    port: 9090
    targetPort: 9090

---
# ServiceMonitor for Prometheus scraping
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-gateway
spec:
  selector:
    matchLabels:
      app: llm-gateway
  endpoints:
  - port: metrics
    interval: 30s

---
# KEDA scaler: scale based on gateway queue
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: llm-gateway
spec:
  scaleTargetRef:
    name: llm-gateway
  minReplicaCount: 2
  maxReplicaCount: 4
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      query: |
        avg(llm_gateway_pending_requests{endpoint="extract"})
      threshold: "64"  # Scale gateway if avg pending > 64 requests

---
# Update: Workers call gateway instead of vLLM directly
# Before:  worker-vlm → http://model-vlm:8000/v1/chat/completions
# After:   worker-vlm → http://llm-gateway:8000/v1/chat/completions
#
# The gateway intelligently routes to the best vLLM replica based on:
# - Queue depth on each replica
# - KV-cache utilization
# - Health status
# - Request tokens and estimated KV-cache needs

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: docuflow-config
data:
  # In docuflow config, update model endpoints to use gateway:
  LLM_BASE_URL: "http://llm-gateway:8000"
  # Gateway handles routing to model-vlm, model-embed, model-llm
  # Workers don't need to know about replicas anymore
