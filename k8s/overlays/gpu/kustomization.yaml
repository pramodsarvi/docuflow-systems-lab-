# Production overlay for the AKS GPU cluster (infra/aks, vLLM model servers, LiteLLM gateway).
#   kubectl apply -k k8s/overlays/gpu           (after `make gpu-docuflow-secrets`)
# Differences from the kind base: no simulator, models via LiteLLM, secrets instead of plain config, hardened pods,
# no fake GPU request on the workers (the vLLM servers hold the real GPUs), PDBs and network policies.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base, policies.yaml]
images:
  - name: docuflow
    newName: ACR_NAME.azurecr.io/docuflow      # `make gpu-docuflow-image ACR=<name>` fills this in
    newTag: prod
patches:
  - path: config-patch.yaml
  - path: hardening-patch.yaml
  - target: {kind: Deployment, name: sim-model}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: sim-model}
  - target: {kind: Service, name: sim-model}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: {name: sim-model}
  - target: {kind: Deployment, name: worker-vlm}
    patch: |-
      - {op: remove, path: /spec/template/spec/containers/0/resources/requests/nvidia.com~1gpu}
      - {op: remove, path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu}
  - target: {kind: Deployment, name: api}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 2}
  - target: {kind: HorizontalPodAutoscaler, name: api}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 2}
      - {op: replace, path: /spec/maxReplicas, value: 6}
  - target: {kind: StatefulSet, name: db}
    patch: |-
      - {op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 100Gi}
      - {op: add, path: /spec/volumeClaimTemplates/0/spec/storageClassName, value: managed-csi-premium}
