name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: docuflow, POSTGRES_PASSWORD: docuflow, POSTGRES_DB: docuflow_test}
        ports: ["5434:5432"]
        options: --health-cmd "pg_isready -U docuflow" --health-interval 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management
        env: {RABBITMQ_DEFAULT_USER: docuflow, RABBITMQ_DEFAULT_PASS: docuflow}
        ports: ["5673:5672"]
        options: --health-cmd "rabbitmq-diagnostics -q check_port_connectivity" --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kustomize + kubeconform
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | sudo tar xz -C /usr/local/bin kubeconform
      - run: make render

  image:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/docuflow:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/docuflow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-kind:
    # Full system on a CPU-only kind cluster (model simulator): RabbitMQ tokens, KEDA scale-from-zero, ingest + query.
    runs-on: ubuntu-latest
    needs: [test, manifests]
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: {install_only: true}
      - uses: azure/setup-helm@v4
      - run: GPU=0 MONITORING=0 scripts/cluster-up.sh
      - run: make deploy OVERLAY=ci-sim
      - run: MODE=gt scripts/smoke.sh http://docuflow.localtest.me
      - if: failure()
        run: |
          kubectl -n docuflow get pods,scaledobject,hpa -o wide
          kubectl -n docuflow logs -l app.kubernetes.io/part-of=docuflow --tail=50 --prefix
