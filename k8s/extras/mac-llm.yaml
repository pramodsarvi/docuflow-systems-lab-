# Agent model served from a Mac (Ollama) through a reverse SSH tunnel, so queries can run while the GPU is
# dedicated to ingest (scripts/mode.sh mac-llm).
#   Mac:    ollama pull qwen3:4b-instruct && ssh -N -R 11434:localhost:11434 root@<server>
#   Server: a relay binds the tunnel onto the kind network only (systemd unit docuflow-mac-llm, see mode.sh)
apiVersion: v1
kind: Service
metadata: {name: mac-llm, namespace: docuflow}
spec:
  ports: [{name: http, port: 11434, targetPort: 11434}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: mac-llm-1
  namespace: docuflow
  labels: {kubernetes.io/service-name: mac-llm}
addressType: IPv4
ports: [{name: http, port: 11434, protocol: TCP}]
endpoints: [{addresses: ["172.18.0.1"]}]   # the kind network's gateway = the server
