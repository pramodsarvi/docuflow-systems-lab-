# One whole GPU per model server: give vLLM most of the memory and more concurrent sequences.
apiVersion: apps/v1
kind: Deployment
metadata: {name: model-vlm}
spec:
  template:
    spec:
      containers:
        - name: vllm
          args: ["--model", "Qwen/Qwen2.5-VL-7B-Instruct", "--served-model-name", "vlm-model", "--host", "0.0.0.0", "--port", "8000",
                 "--gpu-memory-utilization", "0.90", "--max-model-len", "16384", "--max-num-seqs", "64",
                 "--limit-mm-per-prompt", "{\"image\": 1}", "--mm-processor-kwargs", "{\"max_pixels\": 1638400}"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: model-llm}
spec:
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  replicas: null           # KEDA owns it (llm-autoscaling.yaml)
  template:
    spec:
      containers:
        - name: vllm
          args: ["--model", "Qwen/Qwen3-4B-Instruct-2507", "--served-model-name", "standard-model", "--host", "0.0.0.0", "--port", "8000",
                 "--gpu-memory-utilization", "0.90", "--max-model-len", "32768", "--max-num-seqs", "128",
                 "--enable-prefix-caching"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: model-embed}
spec:
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  replicas: null           # KEDA owns it
  template:
    spec:
      containers:
        - name: vllm
          args: ["--model", "Qwen/Qwen3-Embedding-0.6B", "--served-model-name", "embed-model", "--host", "0.0.0.0", "--port", "8000",
                 "--gpu-memory-utilization", "0.90", "--runner", "pooling", "--max-model-len", "2048",
                 "--max-num-seqs", "256"]
