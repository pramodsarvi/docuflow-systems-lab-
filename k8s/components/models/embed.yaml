# vLLM container for embeddings: Qwen/Qwen3-Embedding-0.6B served as `embed-model` (OpenAI-compatible API on :8000).
apiVersion: v1
kind: Service
metadata: {name: model-embed, labels: {app: model-embed}}
spec:
  selector: {app: model-embed}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: model-embed, labels: {app: model-embed}}
spec:
  # no `replicas`: KEDA owns it (autoscaling.yaml)
  # Recreate: on a shared GPU a surge pod cannot get memory until the old ones stop (rolling updates deadlock).
  # Only affects config/image updates, not KEDA scaling. Prod (whole GPUs) patches this back to RollingUpdate.
  strategy: {type: Recreate}
  selector: {matchLabels: {app: model-embed}}
  template:
    metadata:
      labels: {app: model-embed, app.kubernetes.io/component: model-server, docuflow-model: embed}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics}
    spec:
      serviceAccountName: docuflow
      priorityClassName: docuflow-interactive
      terminationGracePeriodSeconds: 60
      nodeSelector: {docuflow.io/pool: gpu}
      tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.13.0      # CUDA 12.9 build; runs on driver >= 570 (newer tags need CUDA 13 drivers)
          imagePullPolicy: IfNotPresent
          args:
            - "--model"
            - "Qwen/Qwen3-Embedding-0.6B"
            - "--served-model-name"
            - "embed-model"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--gpu-memory-utilization"
            - "0.06"
            - "--kv-cache-memory-bytes"
            - "536870912"             # 512 MiB: embedding requests are short and finish in one pass
            - "--runner"
            - "pooling"
            - "--max-model-len"
            - "2048"                  # chunks are <= 700 chars (~200 tokens); 8192 needs 0.88 GiB KV just to start
            - "--max-num-seqs"
            - "64"
          env:
            - {name: HF_HOME, value: /models/hf}
            - {name: VLLM_NO_USAGE_STATS, value: "1"}
            - {name: HF_TOKEN, valueFrom: {secretKeyRef: {name: docuflow-secrets, key: HF_TOKEN, optional: true}}}
          ports: [{name: http, containerPort: 8000}]
          # first start downloads the weights (minutes); later starts load from the cache in ~1 minute
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 180}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 20, failureThreshold: 6}
          resources:
            requests: {cpu: "1", memory: 6Gi, nvidia.com/gpu: 1}
            limits: {memory: 6Gi, nvidia.com/gpu: 1}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: cache, mountPath: /models}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: cache, persistentVolumeClaim: {claimName: model-cache}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 4Gi}}
