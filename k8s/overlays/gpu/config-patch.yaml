apiVersion: v1
kind: ConfigMap
metadata: {name: docuflow-config, namespace: docuflow}
data:
  LLM_BACKEND: openai
  # All model traffic goes through LiteLLM (per-tenant key, budget, rate limit). Aliases from platform/gpu/litellm-config.yaml.
  VLM_BASE_URL: http://litellm.litellm.svc.cluster.local:4000/v1
  LLM_BASE_URL: http://litellm.litellm.svc.cluster.local:4000/v1
  EMBED_BASE_URL: http://litellm.litellm.svc.cluster.local:4000/v1
  VLM_MODEL: vlm-model
  LLM_MODEL: standard-model
  EMBED_MODEL: embed-model
  OLLAMA_URL: ""
  HTTP_RETRIES: "4"
  PER_DATASET_CAP: "6"
