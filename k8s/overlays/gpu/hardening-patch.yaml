apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: docuflow}
spec:
  template:
    metadata:
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8791", prometheus.io/path: /metrics}
    spec:
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: api}}}
      containers:
        - name: api
          env:
            - {name: DOCUFLOW_DSN, valueFrom: {secretKeyRef: {name: docuflow-secrets, key: DOCUFLOW_DSN}}}
            - {name: LLM_API_KEY, valueFrom: {secretKeyRef: {name: docuflow-secrets, key: LLM_API_KEY}}}
            - {name: DOCUFLOW_API_KEY, valueFrom: {secretKeyRef: {name: docuflow-secrets, key: DOCUFLOW_API_KEY}}}
          readinessProbe: {httpGet: {path: /ready, port: 8791}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8791}, periodSeconds: 10, failureThreshold: 6}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 2Gi}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker-io, namespace: docuflow}
spec:
  template:
    spec:
      containers:
        - name: worker
