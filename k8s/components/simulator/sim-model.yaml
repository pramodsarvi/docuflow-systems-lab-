apiVersion: v1
kind: Service
metadata: {name: sim-model, labels: {app: sim-model}}
spec:
  selector: {app: sim-model}
  ports: [{name: http, port: 11434, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sim-model, labels: {app: sim-model}}
spec:
  replicas: 1
  selector: {matchLabels: {app: sim-model}}
  template:
    metadata: {labels: {app: sim-model}}
    spec:
      serviceAccountName: docuflow
      priorityClassName: docuflow-interactive
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: sim
          image: docuflow
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "docuflow.simmodel"]
          env:
            - {name: SIM_VLM_SECONDS, value: "8"}
            - {name: SIM_LLM_SECONDS, value: "1.5"}
          ports: [{name: http, containerPort: 11434}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 15}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
