# Non-secret settings shared by every docuflow pod. Credentials (DSN, API keys) live in the `docuflow-secrets` Secret.
apiVersion: v1
kind: ConfigMap
metadata: {name: docuflow-config}
data:
  LLM_BACKEND: ollama
  OLLAMA_URL: http://ollama:11434
  VLM_MODEL: gemma4:e2b-mlx
  LLM_MODEL: qwen3:4b-instruct
  EMBED_MODEL: qwen3-embedding:0.6b
  # On Kubernetes the pod count (KEDA) is the real concurrency limit; in-app limits must sit above the max replicas,
  # otherwise extra pods start but stay idle (seen in the stress test: 12 vlm pods, 8 working, with a cap of 8).
  LIMIT_IO: "16"
  LIMIT_VLM: "64"
  LIMIT_EMBED: "16"
  PROCS_IO: "16"
  PROCS_VLM: "64"
  PROCS_EMBED: "16"
  PER_DATASET_CAP: "64"   # per-dataset fairness cap; must also sit above worker-vlm maxReplicaCount
  # Queries run on their own model servers (model-llm, model-embed), so page reading does not need to pause for them
  # (the local single-machine default does, because one Ollama serves everything).
  YIELD_TO_QUERIES: "0"
  # ...but on a shared GPU, page reading backs off to 8 concurrent while 24+ queries are in flight, so the agent model
  # gets GPU time (ingest keeps going, just slower). Set QUERY_PRESSURE_INFLIGHT to "0" when models have their own GPUs.
  QUERY_PRESSURE_INFLIGHT: "24"
  VLM_LIMIT_UNDER_QUERY_LOAD: "8"
  # Agent tracing (OpenTelemetry, OpenInference attributes) -> LiteLLM Lens. Empty = off. See scripts/lens-up.sh.
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
  OTEL_SERVICE_NAME: docuflow
  LEASE_SECONDS: "300"
  HTTP_RETRIES: "4"
  WORKER_METRICS_PORT: "9100"
  GC_DONE_JOBS_DAYS: "7"
  GC_QUERIES_DAYS: "30"
  HF_HOME: /tmp/hf
