# Combined LLM Stack: LiteLLM Proxy + llm-d Gateway API
#
# Architecture:
#   workers → LiteLLM:4000 (app features)
#         → llm-d Gateway API:8000 (K8s routing)
#         → vLLM pods (actual inference)
#
# LiteLLM handles: keys, rate limits, cost tracking, logging, unified interface
# llm-d handles: pod-aware routing, queue depth, KV cache, K8s discovery

---
# ========== LiteLLM Proxy Deployment ==========
# Entry point for all LLM requests
# Provides: authentication, rate limiting, cost tracking, logging, fallback routing

apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: default
data:
  config.yaml: |
    # LiteLLM Configuration
    # Frontend: receives requests from workers
    # Backend: routes to llm-d Gateway (which then routes to vLLM pods)

    model_list:
    - model_name: "extract"
      litellm_params:
        model: "openai/Qwen2.5-VL-3B"
        api_base: "http://llm-d-gateway:8000/v1"  # Routes through llm-d
        api_key: "unused"

    - model_name: "embed"
      litellm_params:
        model: "openai/Qwen3-Embedding-0.6B"
        api_base: "http://llm-d-gateway:8000/v1"  # Routes through llm-d
        api_key: "unused"

    - model_name: "agent"
      litellm_params:
        model: "openai/Qwen3-4B"
        api_base: "http://llm-d-gateway:8000/v1"
        api_key: "unused"

    # Rate limiting per key
    rate_limit_models:
    - model: "extract"
      requests_per_second: 100
    - model: "embed"
      requests_per_second: 200
    - model: "agent"
      requests_per_second: 50

    # Cost tracking
    cost_tracking:
      enabled: true
      database_url: "postgresql://user:pass@postgres:5432/litellm"

    # Logging
    logging:
      type: "json"
      level: "INFO"
      database_url: "postgresql://user:pass@postgres:5432/litellm"

    # Fallback handling
    fallback_models:
      - model_name: "extract"
        fallback_models: ["extract-fallback"]
      - model_name: "agent"
        fallback_models: ["agent-fallback"]

    # Request routing
    routing:
      strategy: "simple-shuffle"  # LiteLLM routes to llm-d, llm-d handles pod routing

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  labels:
    app: litellm-proxy
    app.kubernetes.io/component: gateway
spec:
  replicas: 2  # HA proxy
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
    spec:
      serviceAccountName: docuflow
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main
        ports:
        - containerPort: 4000
          name: http
        - containerPort: 6000
          name: metrics

        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: litellm-db
              key: url

        volumeMounts:
        - name: config
          mountPath: /etc/litellm
          readOnly: true

        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 5

        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi

      volumes:
      - name: config
        configMap:
          name: litellm-config

---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  labels:
    app: litellm-proxy
spec:
  type: ClusterIP
  selector:
    app: litellm-proxy
  ports:
  - name: http
    port: 4000
    targetPort: 4000
  - name: metrics
    port: 6000
    targetPort: 6000

---
# ========== llm-d Gateway API Layer ==========
# Kubernetes-native intelligent pod routing
# Receives requests from LiteLLM, routes to best vLLM pod

apiVersion: gateway.networking.k8s.io/v1beta1
kind: GatewayClass
metadata:
  name: llm-d
spec:
  controllerName: "llm.ai/llm-d"
  description: "llm-d controller for intelligent vLLM pod routing"

---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: llm-d-gateway
spec:
  gatewayClassName: llm-d
  listeners:
  - name: http
    port: 8000
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same

---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: llm-routes
spec:
  parentRefs:
  - name: llm-d-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/
    backendRefs:
    - name: model-vlm
      port: 8000
      weight: 50
    - name: model-embed
      port: 8001
      weight: 50

---
apiVersion: llm.ai/v1alpha1
kind: LLMServicePolicy
metadata:
  name: vllm-routing-policy
spec:
  targetRef:
    kind: Service
    name: model-vlm

  routing:
    strategy: "least_pending_requests"
    metrics:
      - type: "vllm_queue_depth"
      - type: "vllm_kv_cache_utilization"
      - type: "vllm_batch_utilization"

  loadBalancing:
    algorithm: "least_pending_requests"
    considerBatchSlots: true
    considerKVCacheUsage: true

  podAffinity:
    preferPodWithLowestQueue: true

---
apiVersion: llm.ai/v1alpha1
kind: vLLMMonitor
metadata:
  name: vllm-metrics-monitor
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm

  metrics:
  - name: queue_depth
    path: /metrics
    port: 8000
    pollInterval: 5s
  - name: kv_cache_utilization
    path: /metrics
    port: 8000
  - name: batch_utilization
    path: /metrics
    port: 8000

---
# ========== vLLM StatefulSet (Updated) ==========
# Actual model servers with metrics endpoint

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: model-vlm
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: extract
spec:
  serviceName: model-vlm
  replicas: 2
  selector:
    matchLabels:
      app: model-vlm
  template:
    metadata:
      labels:
        app: model-vlm
        app.kubernetes.io/name: vllm
        app.kubernetes.io/instance: extract
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        args:
        - --served-model-name=Qwen2.5-VL-3B
        - --max-model-len=2048
        - --gpu-memory-utilization=0.95
        - --enable-metrics=true           # Enable /metrics for llm-d
        - --metrics-port=8000

        ports:
        - containerPort: 8000
          name: http

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5

        resources:
          requests:
            cpu: 2000m
            memory: 30Gi
            nvidia.com/gpu: 1
          limits:
            cpu: 4000m
            memory: 46Gi
            nvidia.com/gpu: 1

---
# ========== KEDA Scaling ==========
# Scale based on latency metrics in Postgres (from DocuFlow)

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: model-vlm-latency
spec:
  scaleTargetRef:
    name: model-vlm
    kind: StatefulSet
  minReplicaCount: 1
  maxReplicaCount: 8
  triggers:
  - type: postgresql
    metadata:
      query: |
        SELECT PERCENTILE_CONT(0.95) WITHIN GROUP (ORDER BY latency_ms)
        FROM model_latencies
        WHERE stage='extract' AND endpoint='model-vlm'
        AND ts > now() - interval '2 minutes'
      targetQueryValue: "5000"

---
# ========== Secrets ==========

apiVersion: v1
kind: Secret
metadata:
  name: litellm-db
type: Opaque
stringData:
  url: "postgresql://litellm:password@postgres:5432/litellm"

---
# ========== Worker Configuration ==========
#
# OLD: workers called vLLM directly
#   POST http://model-vlm:8000/v1/chat/completions
#
# NEW: workers call LiteLLM proxy
#   POST http://litellm-proxy:4000/v1/chat/completions
#
# Data flow:
#   1. Request hits LiteLLM at :4000
#   2. LiteLLM checks key, rate limit, logs request
#   3. LiteLLM forwards to llm-d Gateway at :8000
#   4. llm-d queries vLLM pods for /metrics
#   5. llm-d selects best pod (least queue, most KV cache)
#   6. llm-d forwards to selected vLLM pod
#   7. vLLM processes request
#   8. Response flows back through llm-d → LiteLLM → worker
#
# Each layer handles:
#   LiteLLM:
#     - API key validation
#     - Rate limiting per key
#     - Cost tracking
#     - Request/response logging
#     - Fallback handling
#     - Unified interface (workers don't know about llm-d)
#
#   llm-d:
#     - Pod discovery (Kubernetes Service)
#     - Health checking
#     - Intelligent routing (queue depth, KV cache)
#     - Load shedding (503 when full)
#     - Pod scaling signals (informs KEDA)
#
#   vLLM:
#     - Actual inference
#     - Metrics exposure (/metrics)
#     - Continuous batching
#     - KV cache management

apiVersion: v1
kind: ConfigMap
metadata:
  name: docuflow-config-litellm
data:
  # All three model roles (extract/vlm, agent/llm, embed) route through LiteLLM proxy
  LLM_BACKEND: "openai"
  VLM_BASE_URL: "http://litellm-proxy:4000/v1"
  LLM_BASE_URL: "http://litellm-proxy:4000/v1"
  EMBED_BASE_URL: "http://litellm-proxy:4000/v1"
  VLM_API_KEY: "none"
  LLM_API_KEY: "none"
  EMBED_API_KEY: "none"
  VLM_MODEL: "Qwen2.5-VL-3B"
  LLM_MODEL: "Qwen3-4B"
  EMBED_MODEL: "Qwen3-Embedding-0.6B"
  # Worker concurrency limits (KEDA owns pod count)
  LIMIT_VLM: "64"
  LIMIT_EMBED: "16"
  PROCS_VLM: "64"
  PROCS_EMBED: "16"
  YIELD_TO_QUERIES: "0"
