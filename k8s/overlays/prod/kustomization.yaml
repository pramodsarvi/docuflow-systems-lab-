# Production on a GPU cluster (AKS / EKS / GKE with the NVIDIA GPU Operator, KEDA and kube-prometheus-stack installed).
#
#   make prod-secrets          creates docuflow-secrets from your environment (never committed)
#   make prod-deploy REGISTRY=myregistry.azurecr.io TAG=v0.2.0 HOST=docuflow.example.com
#
# Differences from local-gpu: the 7B vision model on whole GPUs (no time-slicing), KEDA scales it 1..4 on vLLM load, API 2..6 replicas, TLS ingress, premium disks, nightly pg_dump backups, secrets out of band.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: docuflow
resources:
  - ../../base
  - backup-cronjob.yaml
components:
  - ../../components/models
  - ../../components/monitoring
  - ../../components/ingress
images:
  - name: docuflow
    newName: REGISTRY/docuflow          # filled in by `make prod-deploy`
    newTag: TAG
patches:
  - path: patches/models-whole-gpu.yaml
  - path: patches/model-cache.yaml
  - target: {kind: ScaledObject, name: api}
    patch: |-
      - {op: replace, path: /spec/minReplicaCount, value: 2}
      - {op: replace, path: /spec/maxReplicaCount, value: 6}
  - target: {kind: ScaledObject, name: model-vlm}
    patch: |-
      - {op: replace, path: /spec/maxReplicaCount, value: 4}
      - {op: replace, path: /spec/triggers/0/metadata/threshold, value: "16"}   # per GPU replica (max-num-seqs 64)
      - {op: replace, path: /spec/cooldownPeriod, value: 600}
  - target: {kind: PersistentVolume, name: docuflow-model-cache}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolume
      metadata: {name: docuflow-model-cache}
  - target: {kind: ScaledObject, name: worker-vlm}
    patch: |-
      - {op: replace, path: /spec/maxReplicaCount, value: 48}   # up to 48 concurrent page reads -> model-vlm 3-4 replicas
  - target: {kind: StatefulSet, name: db}
    patch: |-
      - {op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 200Gi}
      - {op: add, path: /spec/volumeClaimTemplates/0/spec/storageClassName, value: managed-csi-premium}
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/cpu, value: "2"}
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 8Gi}
      - {op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 16Gi}
      - {op: replace, path: /spec/template/spec/containers/0/args, value: ["-c", "max_connections=400", "-c", "shared_buffers=4GB", "-c", "effective_cache_size=12GB", "-c", "log_min_duration_statement=2000"]}
  - target: {kind: Ingress, name: api}
    patch: |-
      - {op: replace, path: /spec/rules/0/host, value: HOST}
      - {op: add, path: /spec/tls, value: [{hosts: [HOST], secretName: docuflow-tls}]}
      - {op: add, path: /metadata/annotations/cert-manager.io~1cluster-issuer, value: letsencrypt}
      - {op: add, path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect, value: "true"}
